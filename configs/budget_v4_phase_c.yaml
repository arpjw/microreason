# Budget for protocol v4 Phase C (reports/protocol_v4.md): 3 x v4-grpo + 3 x time-matched
# v2-extra-sft, secondary arms v4-rft-s1 and v4-grpo-step-s1, val evals, and the single
# confirmatory test evaluation (reports/confirmatory_plan_v3.md). One pod.
# Estimate after amendment 1 (150-step runs at ~18 s/step): about 7 h, about $7 at $0.99/h.
# Owner pre-approved the whole protocol v4 experiment in chat on 2026-11-08 ("Consider the
# experiment pre approved, get it done"); caps $9 / 8 h as proposed. Runs on the Phase B pod
# (same GPU and rate), with its own billing start for this session's ledger.
paid_compute_allowed: true
provider: runpod
gpu_type: NVIDIA RTX 6000 Ada Generation (Secure Cloud)
hourly_rate_usd: 0.99
max_spend_usd: 9.0
max_runtime_hours: 8.0
reserve_minutes: 20
shutdown_rule: >-
  Copy reports, metrics, budget ledgers, eval rows and every final RL-stage checkpoint off the
  pod, then terminate (delete) it when the session finishes, at either ceiling, or on any
  failure; the pod also deletes itself 45 minutes after finishing if not collected.
approved_by: project owner (pre-approval in chat for protocol v4)
approved_at: "2026-11-08"
