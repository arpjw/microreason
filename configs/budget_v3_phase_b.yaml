# Budget for protocol v3 Phase B (reports/protocol_v3.md): data v3 build, tokenizer v2,
# v0-base -> v1-math -> v2-sft, val and held-out-val evaluations, capability gate. One pod.
# Owner approved in chat on 2026-11-08 ("Approve Phase B") after a quoted estimate of about
# $3-3.5 with caps of $6 and 4.5 h. hourly_rate_usd must equal the live rate of the pod created.
paid_compute_allowed: true
provider: runpod
gpu_type: NVIDIA RTX 6000 Ada Generation (Secure Cloud)
hourly_rate_usd: 0.99
max_spend_usd: 6.0
max_runtime_hours: 4.5
reserve_minutes: 15
shutdown_rule: >-
  Copy reports, data v3 manifests (including the frozen-suite file), tokenizer v2, metrics,
  budget ledgers, eval rows and the v0-base, v1-math and v2-sft checkpoints off the pod, then
  terminate (delete) it when the session finishes, at either ceiling, or on any failure; the pod
  also deletes itself 45 minutes after finishing if not collected.
approved_by: project owner (approval in chat for protocol v3 Phase B)
approved_at: "2026-11-08"
