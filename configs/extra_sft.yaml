# Stage 4B: v2-extra-sft, the equal-compute control for H4 (spec §6). Continues v2-sft with the
# same SFT recipe (format split 75/25, masked loss) on new training-only examples from the
# `sft_extra` partition of stream rl1, the same template mix GRPO trains on, with gold solutions.
# LR is constant at v2-sft's final LR (5e-6), the same as GRPO's.
# Compute matching (declared before either run): the session passes
# --max-wall-seconds = GRPO's measured train_wall_seconds (its training loop: rollouts,
# verification and updates; final evaluations excluded for both branches).
stage: extra_sft
model: configs/model_43m.yaml
tokenizer: artifacts/tokenizer/v1
parent: artifacts/p2-v2-sft
sft:
  train_manifest: data/manifests/math_train_stream_rl1.json
  stream_partition: sft_extra
  val_manifest: data/manifests/math_val_v1.json
  num_examples: 500000
  show_work_fraction: 0.75
  val_examples_per_format: 256
seed: 47
precision: bf16
sequence_length: 256
effective_batch_tokens: 16384  # 64 examples per optimizer step, as in v2-sft
micro_batch_size: 64
max_examples: 20000000         # upper cap only; the wall-time limit ends the run
log_every_steps: 50
eval_every_steps: 2000
checkpoint_every_steps: 100000
optimizer:
  name: adamw
  peak_lr: 0.000005
  weight_decay: 0.1
  grad_clip_norm: 1.0
scheduler:
  name: constant
  warmup_fraction: 0.0
budget:
  paid_compute_allowed: false
  max_spend_usd: 0
