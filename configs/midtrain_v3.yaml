# Protocol v3 (reports/protocol_v3.md): derived from the v2 config with tokenizer v2 and data v3.
# Protocol v2 math mid-training: 200 M tokens (reports/protocol_v2.md), same curriculum fractions.
# Stage 2 math mid-training with an easy-to-hard curriculum (spec §6). Proposal only; nothing here
# has been run. Uniform-sampling ablation: configs/midtrain_uniform.yaml.
#
# Overall 85/15 math/general replay by processed tokens. Math comes from shard b of the
# training-only stream, split into curriculum buckets: easy = levels 1-2 (5.97 M tokens) and
# hard = levels 3-4 (28.13 M tokens). Planned use over 40 M tokens: easy ~8.1 M (~1.3 passes),
# hard ~25.9 M (<1 pass), general ~6 M. Phase changes are logged in the run manifest.
stage: midtrain
model: configs/model_43m.yaml
tokenizer: artifacts/tokenizer/v2
parent: runs/pretrain_v1/checkpoints/FINAL  # replace with the v0-base checkpoint path
mixture:
  - {dataset: data/tokenized_v2/math_stream_b_easy_v3, weight: 0.2}
  - {dataset: data/tokenized_v2/math_stream_b_hard_v3, weight: 0.65}
  - {dataset: data/tokenized_v2/general_text_train_v1, weight: 0.15}
curriculum:
  - until_fraction: 0.25
    weights:
      data/tokenized_v2/math_stream_b_easy_v3: 0.45
      data/tokenized_v2/math_stream_b_hard_v3: 0.40
      data/tokenized_v2/general_text_train_v1: 0.15
  - until_fraction: 0.60
    weights:
      data/tokenized_v2/math_stream_b_easy_v3: 0.20
      data/tokenized_v2/math_stream_b_hard_v3: 0.65
      data/tokenized_v2/general_text_train_v1: 0.15
  - until_fraction: 1.0
    weights:
      data/tokenized_v2/math_stream_b_easy_v3: 0.05
      data/tokenized_v2/math_stream_b_hard_v3: 0.80
      data/tokenized_v2/general_text_train_v1: 0.15
validation:
  - {dataset: data/tokenized_v2/general_text_val_v1, sequences: 256}
  - {dataset: data/tokenized_v2/math_val_v3, sequences: 256}
seed: 53
precision: bf16
sequence_length: 1024
effective_batch_tokens: 32768
micro_batch_size: 16
max_train_tokens: 200000000
eval_every_steps: 500
checkpoint_every_steps: 2000
optimizer:
  name: adamw
  peak_lr: 0.0001
  weight_decay: 0.1
  grad_clip_norm: 1.0
scheduler:
  name: cosine
  warmup_fraction: 0.02
  min_lr_fraction: 0.1
budget:
  paid_compute_allowed: false
  max_spend_usd: 0
