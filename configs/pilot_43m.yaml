# Phase 5 GPU pilot: full 43M model, real batch size, short run to measure throughput, memory and
# cost. NOT AUTHORIZED: approved_by / approved_at are placeholders, so this config fails
# validation until the project owner approves a specific provider, GPU, rate and limits.
stage: pretrain
model: configs/model_43m.yaml
tokenizer: artifacts/tokenizer/v1
mixture:
  - {dataset: data/tokenized/general_text_train_v1, weight: 0.7}
  - {dataset: data/tokenized/math_train_v1, weight: 0.3}
validation:
  - {dataset: data/tokenized/general_text_val_v1, sequences: 128}
  - {dataset: data/tokenized/math_val_v1, sequences: 128}
seed: 42
precision: bf16
sequence_length: 1024
effective_batch_tokens: 65536
micro_batch_size: 16
max_steps: 200
log_every_steps: 10
eval_every_steps: 100
checkpoint_every_steps: 100
optimizer:
  name: adamw
  peak_lr: 0.0003
  weight_decay: 0.1
  grad_clip_norm: 1.0
scheduler:
  name: cosine
  warmup_fraction: 0.02
  min_lr_fraction: 0.1
budget:
  paid_compute_allowed: true
  provider: runpod
  gpu_type: NVIDIA GeForce RTX 4090 (Secure Cloud)
  hourly_rate_usd: 0.89
  max_spend_usd: 5.0
  max_runtime_hours: 3.0
  reserve_minutes: 10
  shutdown_rule: >-
    Copy reports, metrics and the budget ledger off the pod, then terminate (delete) the pod when
    the pilot finishes, on either ceiling, or on any failure. Never leave it stopped or idle.
  approved_by: PENDING
  approved_at: PENDING
