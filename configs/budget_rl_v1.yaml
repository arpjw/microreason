# Budget for the RL-stage branches (gate, v4-grpo, v2-extra-sft, v3-dpo, val evaluations), one pod.
# Owner approved in chat on 2026-11-08 ("take care of all of it ... get the code running on the
# pod") after a quoted estimate of roughly $1-3; Claude set these bounds.
# hourly_rate_usd must equal the live rate of the pod actually created.
paid_compute_allowed: true
provider: runpod
gpu_type: NVIDIA GeForce RTX 5090 (Secure Cloud)
hourly_rate_usd: 1.19
max_spend_usd: 5.0
max_runtime_hours: 3.5
reserve_minutes: 15
shutdown_rule: >-
  Copy reports, metrics, rollout and pair records, eval rows, budget ledgers and the final
  v4-grpo, v2-extra-sft and v3-dpo checkpoints off the pod, then terminate (delete) it when the
  session finishes, at either ceiling, or on any failure; the pod also deletes itself 45 minutes
  after finishing if not collected.
approved_by: project owner (approval in chat for the RL branches)
approved_at: "2026-11-08"
