# Protocol v2 training-only math stream (~9.4 M problems, ~470 M tokens). See reports/protocol_v2.md.
# Same generators and in-distribution ranges as v1; frozen evaluation problems excluded.
# Generated in parallel per template, merged in this file's template order with global de-dup.
version: v2
root_seed: 20261108
max_attempts_factor: 20
parallel_workers: 12
# Shard a (base pretraining, ~300 M tokens) and shard b (mid-training, ~170 M) are disjoint.
shard_a_fraction: 0.638
targets:
  # capacity-limited single-operation templates (|n| <= 99): take everything available
  add_ab: 20000
  sub_ab: 40000
  mul_ab: 20000
  div_ab: 40000
  x_plus_a_equals_b: 40000
  ax_equals_b: 9000
  # large templates, ~64 M tokens each; the two single-sided equation templates are capped
  # below their ~1.05 M unique-problem space
  add_mul_abc: 1520000
  mul_sub_mul: 1080000
  sub_mul_add: 1080000
  ax_plus_b_equals_c: 900000
  paren_sum_times_diff: 1120000
  a_times_paren_diff: 1600000
  a_paren_x_plus_b_equals_c: 900000
  ax_plus_b_equals_cx_plus_d: 1000000
eval_manifest_dir: data/manifests
eval_version: v1
out_path: data/generated/math_v1/train_stream_v2/train_stream.jsonl
manifest_path: data/manifests/math_train_stream_v2.json
tokenized_prefix: math_stream
